[project]
name = "notebooklm-research"
version = "0.1.0"
description = "ResearchTool: grounded query/discover over the NotebookLM MCP server, with traceable citations and human-approved corpus changes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gastón Villalba" }]
dependencies = ["mcp>=2.2,<3", "anyio>=4"]

[project.scripts]
nlm-research = "notebooklm_research.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notebooklm_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: talks to the real notebooklm-mcp server; run with `pytest -m live`"]

[tool.coverage.run]
source = ["notebooklm_research"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Physics text: ρ is density, not a typo for p.
allowed-confusables = ["ρ"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
